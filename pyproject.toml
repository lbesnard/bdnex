[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bdnex"
version = "0.3.0"
description = "BD (french comic) tagger and library organizer"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Laurent Besnard", email = "besnard.laurent@gmail.com" }]
license = { text = "MIT" }
keywords = ["comics", "bd", "bedetheque", "comicrack", "cbz", "cbr", "metadata"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "InquirerPy",
  "beautifulsoup4",
  "lxml",
  "pydantic>=2",
  "pymupdf",
  "python-dateutil",
  "pyyaml",
  "rapidfuzz",
  "rarfile",
  "requests",
  "xmlschema",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ipdb", "opencv-python-headless>=4.8"]
docs = ["sphinx>=7", "furo", "myst-parser"]
cover = ["opencv-python-headless>=4.8"]  # `cover.check`: compare a file's cover with the album's

[project.urls]
Homepage = "https://github.com/lbesnard/bdnex"
Issues = "https://github.com/lbesnard/bdnex/issues"

[project.entry-points."bdnex.sources"]
bedetheque = "bdnex.importer.bedetheque:create_source"

[project.scripts]
bdnex = "bdnex.ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bdnex*"]

[tool.setuptools.package-data]
"bdnex.conf" = ["*.json", "*.ini", "*.yaml", "*.xsd", "*.conf"]

[tool.pytest.ini_options]
testpaths = ["test"]
