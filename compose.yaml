# bdnex and its web page. Copy .env.example to .env, fill it in, create the three folders (mkdir -p config data covers: Docker
# would create them as root, and the container does not run as root), then: docker compose up -d
# The image is the one published by each release (ghcr.io). To build it from this checkout instead (your own changes):
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  bdnex:
    image: ghcr.io/lbesnard/bdnex:${BDNEX_VERSION:-latest}   # BDNEX_VERSION=0.13.0 pins a release; `docker compose pull` updates
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"          # the owner of the files it writes: `id -u` and `id -g`
    ports:
      - "${BDNEX_PORT:-8765}:8765"
    environment:
      BDNEX_USER: "${BDNEX_USER:-bdnex}"
      BDNEX_PASSWORD: "${BDNEX_PASSWORD:?set BDNEX_PASSWORD in .env: the web page is not open without a login}"
    volumes:
      - "${COMICS_DIR:?set COMICS_DIR in .env: the folder with your comics}:/comics"
      - "${CONFIG_DIR:-./config}:/config"        # bdnex.yaml
      - "${DATA_DIR:-./data}:/data"              # the library (SQLite)
      - "${COVERS_DIR:-./covers}:/covers"        # downloaded covers
      # - "${INBOX_DIR}:/inbox"                  # a folder of new downloads: add it to `import.sources` as /inbox
    # Behind Traefik, drop `ports` and use labels like these (HTTPS makes the login safe beyond your LAN):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.bdnex.rule=Host(`bdnex.example.org`)
    #   - traefik.http.routers.bdnex.entrypoints=websecure
    #   - traefik.http.routers.bdnex.tls=true
    #   - traefik.http.services.bdnex.loadbalancer.server.port=8765

  # OPTIONAL, but highly recommended: FlareSolverr, a page fetcher that gets past the site's anti-bot checks, so the album pages
  # (authors, publisher, summary...) can be read. Uncomment it, then set `fetch.endpoint` in /config/bdnex.yaml to its address; from the
  # bdnex container that is http://flaresolverr:8191 (the service name is the host name). Taken from FlareSolverr's own compose file:
  # https://github.com/FlareSolverr/FlareSolverr/blob/master/docker-compose.yml
