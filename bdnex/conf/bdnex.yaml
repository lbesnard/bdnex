# bdnex default configuration. Your own file only needs the options you change.
config_version: 2

directory: /path/to/comics/library      # root of the managed library (placeholder)
library: ~/.local/share/bdnex/bdnex.sqlite

match:
  strong_threshold: 90                  # title score (0-100): applied without asking
  medium_threshold: 70                  # between medium and strong: ask; below: no match

import:
  mode: in_place                        # in_place | copy | move
  resume: true

duplicates:
  keys: [series, volume]                # what makes two albums the same: series | volume | title
  action: ask                           # ask | skip | keep_both | replace

write:
  cbr: convert                          # convert | skip
  pdf: convert                          # convert | skip
  pdf_mode: auto                        # auto | extract | render
  pdf_dpi: 200                          # resolution when pages have to be rendered
  delete_original: ask                  # ask | yes | no
  conflict: ask                         # ask | file | database

paths:
  oneshot: 'OneShot/$language/$title - $authors/$title - $authors'
  series: 'Series/$series/$series - T$volume:02 - $title'
  missing_field: ask                    # ask | placeholder | skip
  placeholder: Unknown

bedetheque:
  delay: [3, 10]                        # seconds slept before each real album/series page request
  sitemap_delay: [0.5, 1.5]             # seconds slept between sitemap files (about 55 plain XML files)
  pages_dir: ~/.local/share/bdnex/pages # where saved album pages are looked up
  fetcher: null                         # "package.module:function" returning page bytes for a url
  fetcher_endpoint: null                # free string for your fetcher (e.g. a server url)
